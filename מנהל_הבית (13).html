<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מנהל הבית</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#efede8;
  --txt:#1a1a18;--txt2:#6b6b66;--txt3:#9b9b95;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --r:8px;--rl:12px;
  --green:#1D9E75;--green2:#0F6E56;
  --red-bg:#FCEBEB;--red-txt:#A32D2D;
  --warn-bg:#FAEEDA;--warn-txt:#854F0B;
  --ok-bg:#EAF3DE;--ok-txt:#3B6D11;
  --info-bg:#E6F1FB;--info-txt:#185FA5;
}
@media(prefers-color-scheme:dark){:root{--bg:#1e1e1c;--bg2:#2a2a28;--bg3:#323230;--txt:#f0f0ec;--txt2:#a0a09a;--txt3:#707068;--border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);--red-bg:#3a1515;--red-txt:#f09595;--warn-bg:#2e2010;--warn-txt:#FAC775;--ok-bg:#152510;--ok-txt:#C0DD97;--info-bg:#0a1e30;--info-txt:#85B7EB;}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--txt);min-height:100vh;padding:16px}
.app-shell{max-width:860px;margin:0 auto;background:var(--bg);border-radius:16px;border:0.5px solid var(--border);overflow:hidden}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:0.5px solid var(--border)}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-title{font-size:18px;font-weight:500;display:flex;align-items:center;gap:8px}
.hdr-icon{width:28px;height:28px;background:var(--green);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-right{display:flex;align-items:center;gap:7px}
.hdr-date{font-size:12px;color:var(--txt2)}
.app-tabs{display:flex;gap:2px;padding:10px 20px;border-bottom:0.5px solid var(--border);overflow-x:auto}
.tab{padding:6px 14px;border-radius:var(--r);border:0.5px solid transparent;background:transparent;cursor:pointer;font-size:13px;color:var(--txt2);font-family:inherit;white-space:nowrap}
.tab.on{background:var(--bg2);border-color:var(--border2);color:var(--txt);font-weight:500}
.tab:hover:not(.on){background:var(--bg2)}
.app-body{padding:18px 20px;min-height:400px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
@media(max-width:540px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg2);border-radius:var(--r);padding:12px 14px}
.stat-lbl{font-size:11px;color:var(--txt2);margin-bottom:5px}
.stat-val{font-size:22px;font-weight:500}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.sec-title{font-size:14px;font-weight:500}
.hdr-btns{display:flex;gap:5px}
.btn-add{padding:6px 12px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r);cursor:pointer;font-size:12px;font-family:inherit;color:var(--txt)}
.btn-add:hover{background:var(--bg3)}
.btn-scan{padding:6px 13px;background:#1D9E75;border:none;border-radius:var(--r);cursor:pointer;font-size:12px;font-family:inherit;color:#fff;font-weight:500}
.btn-scan:hover{background:#0F6E56}
.btn-settings{padding:5px 10px;background:transparent;border:0.5px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px;font-family:inherit;color:var(--txt2)}
.btn-settings:hover{background:var(--bg2)}
.badge{display:inline-block;padding:2px 8px;border-radius:var(--r);font-size:11px;font-weight:500}
.b-ok{background:var(--ok-bg);color:var(--ok-txt)}.b-warn{background:var(--warn-bg);color:var(--warn-txt)}.b-exp{background:var(--red-bg);color:var(--red-txt)}.b-paid{background:var(--ok-bg);color:var(--ok-txt)}.b-due{background:var(--warn-bg);color:var(--warn-txt)}.b-over{background:var(--red-bg);color:var(--red-txt)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
.prod-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:13px 15px}
.prod-name{font-size:14px;font-weight:500;margin-bottom:2px}
.prod-sub{font-size:11px;color:var(--txt2);margin-bottom:7px}
.prod-meta{font-size:11px;color:var(--txt2);margin-top:5px;line-height:1.6}
.prod-acts{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.btn-sm{padding:3px 9px;border-radius:var(--r);border:0.5px solid var(--border2);background:transparent;cursor:pointer;font-size:11px;font-family:inherit;color:var(--txt2)}
.btn-sm:hover{background:var(--bg2)}
.btn-del{color:var(--red-txt);border-color:transparent}
.btn-doc{color:var(--info-txt);border-color:rgba(24,95,165,0.2)}
.bill-list{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:8px}
.bill-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:0.5px solid var(--border)}
.bill-row:last-child{border-bottom:none}
.bill-name{font-size:13px;font-weight:500}
.bill-period{font-size:11px;color:var(--txt2)}
.bill-amt{font-size:13px;font-weight:500;min-width:70px;text-align:left}
.alert-item{display:flex;gap:9px;padding:9px 12px;border-radius:var(--r);margin-bottom:7px}
.a-warn{background:var(--warn-bg)}.a-danger{background:var(--red-bg)}
.a-title{font-size:12px;font-weight:500}
.a-warn .a-title{color:var(--warn-txt)}.a-danger .a-title{color:var(--red-txt)}
.a-sub{font-size:11px;color:var(--txt2)}
.empty{text-align:center;padding:40px 16px;color:var(--txt2);font-size:13px}
.divider{border:none;border-top:0.5px solid var(--border);margin:14px 0}
.total-row{text-align:left;margin-top:8px;font-size:12px;color:var(--txt2)}
.wbar{height:3px;border-radius:2px;background:var(--border);margin-top:7px;overflow:hidden}
.wfill{height:100%;border-radius:2px}
.form-wrap{max-width:520px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--txt2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--txt);font-family:inherit;font-size:13px}
.field textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{padding:8px 20px;background:var(--green);border:none;border-radius:var(--r);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary:hover{background:var(--green2)}
.btn-cancel{padding:8px 16px;background:transparent;border:0.5px solid var(--border2);border-radius:var(--r);color:var(--txt2);font-size:13px;cursor:pointer;font-family:inherit}
.btn-cancel:hover{background:var(--bg2)}
.search-inp{width:100%;padding:9px 14px;border:0.5px solid var(--border2);border-radius:var(--rl);font-family:inherit;font-size:13px;background:var(--bg);color:var(--txt);margin-bottom:10px}
.filter-btns{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border-radius:var(--r);border:0.5px solid var(--border);background:transparent;cursor:pointer;font-size:12px;font-family:inherit;color:var(--txt2)}
.filter-btn.on{background:var(--bg2);border-color:var(--border2);color:var(--txt);font-weight:500}
.date-filter{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;font-size:12px;color:var(--txt2)}
.date-inp{padding:6px 9px;border:0.5px solid var(--border2);border-radius:var(--r);font-size:12px;background:var(--bg);color:var(--txt);font-family:inherit}
.err{font-size:11px;color:var(--red-txt);min-height:16px;margin-top:3px}
.hint{font-size:10px;color:var(--txt3);margin-top:2px}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.52);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal-panel{background:var(--bg);border-radius:var(--rl);border:0.5px solid var(--border2);width:100%;max-width:680px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.modal-title{font-size:14px;font-weight:500}
.modal-tabs{display:flex;gap:3px;padding:8px 16px;border-bottom:0.5px solid var(--border);flex-shrink:0;overflow-x:auto}
.vtab{padding:5px 12px;border-radius:var(--r);border:0.5px solid transparent;background:transparent;cursor:pointer;font-size:12px;font-family:inherit;color:var(--txt2);white-space:nowrap}
.vtab.on{background:var(--bg2);border-color:var(--border2);color:var(--txt);font-weight:500}
.vtab:hover:not(.on){background:var(--bg2)}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:420px){.detail-grid{grid-template-columns:1fr}}
.detail-field{background:var(--bg2);border-radius:var(--r);padding:9px 12px}
.detail-lbl{font-size:10px;color:var(--txt2);margin-bottom:3px}
.detail-val{font-size:13px;font-weight:500}
.doc-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.doc-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border-radius:var(--r);border:0.5px solid var(--border)}
.doc-icon{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.doc-icon-pdf{background:#FAECE7}.doc-icon-img{background:#E6F1FB}.doc-icon-link{background:#EAF3DE}.doc-icon-other{background:var(--bg3)}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:11px;color:var(--txt2)}
.doc-actions{display:flex;gap:4px}
.doc-preview{margin-top:12px;border-radius:var(--r);overflow:hidden;border:0.5px solid var(--border)}
.doc-preview img{width:100%;display:block;max-height:380px;object-fit:contain;background:var(--bg2)}
.doc-preview iframe{width:100%;height:400px;border:none;display:block}
.doc-preview-url{padding:16px;background:var(--bg2);border-radius:var(--r);text-align:center}
.add-doc-form{background:var(--bg2);border-radius:var(--r);padding:13px;border:0.5px solid var(--border)}
.add-doc-tabs{display:flex;gap:4px;margin-bottom:10px}
.adtab{padding:4px 11px;border-radius:var(--r);border:0.5px solid transparent;background:transparent;cursor:pointer;font-size:12px;font-family:inherit;color:var(--txt2)}
.adtab.on{background:var(--bg);border-color:var(--border2);color:var(--txt)}
.upload-zone{border:1.5px dashed var(--border2);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;background:var(--bg)}
.upload-zone:hover{background:var(--bg2)}
/* SCAN MODAL */
.scan-drop-zone{border:2px dashed var(--border2);border-radius:var(--rl);padding:32px 20px;text-align:center;cursor:pointer;background:var(--bg2);transition:border-color 0.15s,background 0.15s}
.scan-drop-zone:hover,.scan-drop-zone.drag{border-color:var(--green);background:var(--ok-bg)}
.scan-drop-icon{font-size:36px;margin-bottom:10px}
.scan-drop-title{font-size:14px;font-weight:500;margin-bottom:4px}
.scan-drop-sub{font-size:12px;color:var(--txt2)}
.scan-preview-img{max-width:100%;max-height:220px;border-radius:var(--r);border:0.5px solid var(--border);display:block;margin:0 auto}
.scan-status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);margin:12px 0;font-size:13px}
.scan-status.loading{background:var(--info-bg);color:var(--info-txt)}
.scan-status.success{background:var(--ok-bg);color:var(--ok-txt)}
.scan-status.error{background:var(--red-bg);color:var(--red-txt)}
.spinner{width:18px;height:18px;border:2px solid rgba(24,95,165,0.3);border-top-color:var(--info-txt);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-results{background:var(--bg2);border-radius:var(--rl);border:0.5px solid var(--border);overflow:hidden;margin-top:12px}
.scan-result-header{padding:10px 14px;background:var(--ok-bg);border-bottom:0.5px solid var(--border)}
.scan-result-title{font-size:13px;font-weight:500;color:var(--ok-txt)}
.scan-result-body{padding:14px}
.scan-field{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.scan-field label{font-size:12px;color:var(--txt2);min-width:110px;flex-shrink:0}
.scan-field input,.scan-field select{flex:1;padding:6px 9px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--txt);font-family:inherit;font-size:13px}
.scan-items-list{margin-top:8px}
.scan-item-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:0.5px solid var(--border)}
.scan-item-row:last-child{border-bottom:none}
.scan-item-row input{flex:1;padding:5px 8px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--txt);font-family:inherit;font-size:12px}
.scan-item-row .price-inp{max-width:80px}
.scan-create-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn-create-bill{padding:8px 16px;background:var(--info-bg);border:0.5px solid rgba(24,95,165,0.3);border-radius:var(--r);cursor:pointer;font-size:12px;font-family:inherit;color:var(--info-txt);font-weight:500}
.btn-create-bill:hover{background:#d0e8f8}
.btn-create-prod{padding:8px 16px;background:var(--ok-bg);border:0.5px solid rgba(59,109,17,0.3);border-radius:var(--r);cursor:pointer;font-size:12px;font-family:inherit;color:var(--ok-txt);font-weight:500}
.btn-create-prod:hover{background:#d6ecb8}
.api-key-note{font-size:11px;color:var(--txt3);margin-top:8px;line-height:1.5}
.settings-box{background:var(--bg2);border-radius:var(--rl);border:0.5px solid var(--border);padding:16px;margin-bottom:14px}
.settings-title{font-size:13px;font-weight:500;margin-bottom:4px}
.settings-sub{font-size:11px;color:var(--txt2);margin-bottom:10px}
.key-row{display:flex;gap:8px}
.key-row input{flex:1;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--txt);font-family:inherit;font-size:13px}
.key-saved{font-size:11px;color:var(--ok-txt);margin-top:5px}
/* PAYMENTS */
.month-bar-wrap{margin-bottom:6px}
.month-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.month-bar-lbl{font-size:12px;color:var(--txt2);min-width:68px;text-align:right;flex-shrink:0}
.month-bar-track{flex:1;height:20px;background:var(--bg2);border-radius:4px;overflow:hidden;position:relative}
.month-bar-fill{height:100%;border-radius:4px;background:var(--green);transition:width 0.4s}
.month-bar-fill.unpaid{background:#BA7517}
.month-bar-amt{font-size:12px;font-weight:500;min-width:72px;text-align:left}
.month-bar-badges{display:flex;gap:4px;align-items:center}
.pay-month-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg2);border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.pay-month-title{font-size:13px;font-weight:500}
.pay-month-total{font-size:13px;font-weight:500;color:var(--green)}
.pay-month-body{padding:0 4px 8px}
.pay-legend{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.pay-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt2)}
.pay-legend-dot{width:10px;height:10px;border-radius:2px}
.pay-year-sel{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.pay-year-sel select{padding:5px 9px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--txt);font-family:inherit;font-size:13px}
.pay-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
@media(max-width:480px){.pay-summary-grid{grid-template-columns:repeat(2,1fr)}}
/* INSTALLMENTS */
.inst-section{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.inst-section-hdr{padding:10px 14px;background:var(--info-bg);border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.inst-section-title{font-size:13px;font-weight:500;color:var(--info-txt)}
.inst-card{padding:12px 14px;border-bottom:0.5px solid var(--border)}
.inst-card:last-child{border-bottom:none}
.inst-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.inst-card-name{font-size:13px;font-weight:500}
.inst-card-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;background:var(--bg2);border:0.5px solid var(--border2);font-size:11px;color:var(--txt2)}
.inst-progress-wrap{margin-bottom:6px}
.inst-progress-track{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-bottom:3px}
.inst-progress-fill{height:100%;border-radius:3px;background:var(--green)}
.inst-progress-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--txt3)}
.inst-months{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.inst-month-dot{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;cursor:default}
.inst-dot-paid{background:var(--ok-bg);color:var(--ok-txt)}
.inst-dot-current{background:var(--green);color:#fff}
.inst-dot-future{background:var(--bg2);color:var(--txt3)}
.inst-dot-overdue{background:var(--red-bg);color:var(--red-txt)}
.inst-form-box{background:var(--bg2);border-radius:var(--r);padding:12px;border:0.5px solid var(--border);margin-top:10px}
.inst-toggle{display:flex;align-items:center;gap:8px;padding:9px 0;cursor:pointer;user-select:none}
.inst-toggle-lbl{font-size:13px;font-weight:500}
.toggle-sw{width:36px;height:20px;border-radius:10px;background:var(--border2);position:relative;transition:background 0.2s;flex-shrink:0}
.toggle-sw.on{background:var(--green)}
.toggle-sw::after{content:'';width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;right:2px;transition:right 0.2s}
.toggle-sw.on::after{right:18px}
.badge-inst{background:var(--info-bg);color:var(--info-txt);border:0.5px solid rgba(24,95,165,0.2)}
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-header">
    <div class="hdr-left">
      <div class="hdr-title">
        <div class="hdr-icon">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1L1 7.5h2.5V15h4v-5h1v5h4V7.5H15L8 1z" fill="white"/></svg>
        </div>
        <div>
          <div>מנהל הבית של משפחת קוטאי</div>
          <div style="font-size:10px;font-weight:400;color:var(--txt3);margin-top:1px">© כל הזכויות שמורות לאבידן קוטאי</div>
        </div>
      </div>
    </div>
    <div class="hdr-right">
      <span class="hdr-date" id="hdr-date"></span>
      <button class="btn-settings" onclick="openSettings()" title="הגדרות">⚙</button>
    </div>
  </div>
  <div class="app-tabs" id="app-tabs"></div>
  <div class="app-body" id="app-body"></div>
</div>

<!-- Main modal (viewer, settings) -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal-panel" id="modal-panel"></div>
</div>

<!-- Scan modal -->
<div class="modal-overlay" id="scan-overlay" style="display:none">
  <div class="modal-panel" id="scan-panel" style="max-width:620px"></div>
</div>

<script>
var DB={products:[],bills:[]};
var UI={view:'dashboard',editing:null,searchQ:'',searchType:'all',viewer:null,viewerTab:'info',viewerDocs:null,addDocMode:'upload',previewDoc:null};

function loadDB(){try{var p=localStorage.getItem('hm_prod');if(p)DB.products=JSON.parse(p);}catch(e){}try{var b=localStorage.getItem('hm_bills');if(b)DB.bills=JSON.parse(b);}catch(e){}}
function saveDB(){try{localStorage.setItem('hm_prod',JSON.stringify(DB.products));}catch(e){}try{localStorage.setItem('hm_bills',JSON.stringify(DB.bills));}catch(e){}}
function loadDocs(id){try{var r=localStorage.getItem('hm_docs_'+id);if(r)return JSON.parse(r);}catch(e){}return[];}
function saveDocs(id,docs){try{localStorage.setItem('hm_docs_'+id,JSON.stringify(docs));}catch(e){}}
function getApiKey(){return localStorage.getItem('hm_apikey')||'';}
function setApiKey(k){localStorage.setItem('hm_apikey',k);}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmtD(s){if(!s)return'—';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtSize(b){if(!b)return'';if(b<1024)return b+'B';if(b<1048576)return Math.round(b/1024)+'KB';return(b/1048576).toFixed(1)+'MB';}
function todayS(){return new Date().toISOString().slice(0,10);}
function daysUntil(ds){if(!ds)return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(ds)-t)/86400000);}
function wStatus(ed){var d=daysUntil(ed);if(d===null)return{cls:'',lbl:'לא הוזן',d:null};if(d<0)return{cls:'exp',lbl:'פגה',d:d};if(d<=30)return{cls:'exp',lbl:d+' ימים',d:d};if(d<=90)return{cls:'warn',lbl:d+' ימים',d:d};return{cls:'ok',lbl:d+' ימים',d:d};}
function bStatus(b){if(b.isPaid)return{cls:'paid',lbl:'שולם'};var d=daysUntil(b.dueDate);if(d!==null&&d<0)return{cls:'over',lbl:'באיחור'};if(d!==null&&d<=7)return{cls:'due',lbl:d+"י'"};return{cls:'',lbl:''};}
function docTypeInfo(doc){if(doc.docType==='link')return{cls:'doc-icon-link',icon:'🔗'};if(doc.mimeType&&doc.mimeType.indexOf('image')===0)return{cls:'doc-icon-img',icon:'🖼'};if(doc.mimeType==='application/pdf'||(doc.name&&doc.name.toLowerCase().endsWith('.pdf')))return{cls:'doc-icon-pdf',icon:'📄'};return{cls:'doc-icon-other',icon:'📎'};}

function catL(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i].l;return id||'אחר';}
function btL(id){for(var i=0;i<BTYPES.length;i++)if(BTYPES[i].id===id)return BTYPES[i].l;return id||'';}

function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){var v=attrs[k];if(k==='class')e.className=v;else if(k==='onClick')e.addEventListener('click',v);else if(k==='onInput')e.addEventListener('input',v);else if(k==='style'&&typeof v==='object')Object.keys(v).forEach(function(sk){e.style[sk]=v[sk];});else if(k==='checked')e.checked=v;else if(k==='value')e.value=v;else if(k==='selected')e.selected=v;else e.setAttribute(k,v);});
  for(var a=2;a<arguments.length;a++){var ch=arguments[a];if(ch==null||ch===false)continue;if(Array.isArray(ch))ch.forEach(function(c){if(c!=null&&c!==false)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});else e.appendChild(typeof ch==='string'?document.createTextNode(ch):ch);}
  return e;
}

var scanState={imgData:null,imgMime:null,scanning:false,result:null};

function openScan(){
  scanState={imgData:null,imgMime:null,scanning:false,result:null};
  buildScanModal();
  document.getElementById('scan-overlay').style.display='flex';
}
function closeScan(){document.getElementById('scan-overlay').style.display='none';}
document.getElementById('scan-overlay').addEventListener('click',function(e){if(e.target===this)closeScan();});

function buildScanModal(){
  var panel=document.getElementById('scan-panel');panel.innerHTML='';
  panel.appendChild(h('div',{class:'modal-header'},
    h('div',{class:'modal-title'},'📷 סריקת חשבונית / קבלה'),
    h('button',{class:'btn-sm',onClick:closeScan},'✕ סגור')
  ));
  var body=h('div',{class:'modal-body',id:'scan-body'});
  panel.appendChild(body);
  buildScanBody(body);
}

function buildScanBody(body){
  body.innerHTML='';
  if(!getApiKey()){
    body.appendChild(h('div',{class:'scan-status error'},
      '⚠',h('div',{},'נדרש מפתח Anthropic API. ',h('a',{href:'#',onClick:function(e){e.preventDefault();closeScan();openSettings();}},h('b',{},'הגדר כאן')))
    ));
    return;
  }
  var fileInp=h('input',{type:'file',style:{display:'none'},accept:'image/*,.pdf'});
  var previewEl=h('div',{style:{textAlign:'center',marginTop:'12px',display:'none'}});
  var zone=h('div',{class:'scan-drop-zone',onClick:function(){fileInp.click();}},
    h('div',{class:'scan-drop-icon'},'📄'),
    h('div',{class:'scan-drop-title'},'צלם או גרור חשבונית / קבלה'),
    h('div',{class:'scan-drop-sub'},'תמונות (JPG, PNG, HEIC) · PDF · עד 5MB')
  );
  zone.addEventListener('dragover',function(e){e.preventDefault();zone.classList.add('drag');});
  zone.addEventListener('dragleave',function(){zone.classList.remove('drag');});
  zone.addEventListener('drop',function(e){e.preventDefault();zone.classList.remove('drag');var f=e.dataTransfer.files[0];if(f)handleScanFile(f,previewEl,statusEl,resultsEl);});
  var statusEl=h('div',{id:'scan-status-el'});
  var resultsEl=h('div',{id:'scan-results-el'});
  body.appendChild(fileInp);body.appendChild(zone);body.appendChild(previewEl);body.appendChild(statusEl);body.appendChild(resultsEl);
  fileInp.addEventListener('change',function(){var f=fileInp.files[0];if(f)handleScanFile(f,previewEl,statusEl,resultsEl);});
}

var ALLOWED_IMG_MIME=['image/jpeg','image/png','image/gif','image/webp'];

function handleScanFile(file,previewEl,statusEl,resultsEl){
  if(file.size>5*1024*1024){statusEl.innerHTML='';statusEl.appendChild(h('div',{class:'scan-status error'},'⚠ הקובץ גדול מדי (מקסימום 5MB)'));return;}
  statusEl.innerHTML='';
  statusEl.appendChild(h('div',{class:'scan-status loading'},h('div',{class:'spinner'}),'טוען קובץ...'));
  var isPdf=(file.type==='application/pdf')||file.name.toLowerCase().endsWith('.pdf');
  var reader=new FileReader();
  reader.onload=function(ev){
    var dataUrl=ev.target.result;
    var base64=dataUrl.split(',')[1];
    if(isPdf){
      // PDF: show icon preview, send as document type
      scanState.imgData=base64;scanState.imgMime='application/pdf';
      previewEl.innerHTML='';
      previewEl.appendChild(h('div',{style:{textAlign:'center',padding:'18px',background:'var(--bg2)',borderRadius:'var(--r)',fontSize:'13px',color:'var(--txt2)'}},'📄 '+file.name));
      previewEl.style.display='block';
      startScanOCR(base64,'application/pdf',statusEl,resultsEl);
    } else {
      var rawMime=file.type||'image/jpeg';
      if(ALLOWED_IMG_MIME.indexOf(rawMime)>=0){
        // Supported image type — send directly
        scanState.imgData=base64;scanState.imgMime=rawMime;
        showScanPreview(dataUrl,previewEl);
        startScanOCR(base64,rawMime,statusEl,resultsEl);
      } else {
        // Unsupported image (HEIC etc.) — convert via canvas
        var img=new Image();
        img.onload=function(){
          var canvas=document.createElement('canvas');
          canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
          canvas.getContext('2d').drawImage(img,0,0);
          var jpegUrl=canvas.toDataURL('image/jpeg',0.92);
          var b64j=jpegUrl.split(',')[1];
          scanState.imgData=b64j;scanState.imgMime='image/jpeg';
          showScanPreview(jpegUrl,previewEl);
          startScanOCR(b64j,'image/jpeg',statusEl,resultsEl);
        };
        img.onerror=function(){statusEl.innerHTML='';statusEl.appendChild(h('div',{class:'scan-status error'},'⚠ פורמט לא נתמך. השתמש ב-JPG, PNG, WebP או PDF.'));};
        img.src=dataUrl;
      }
    }
  };
  reader.readAsDataURL(file);
}

function showScanPreview(dataUrl,previewEl){
  previewEl.innerHTML='';
  previewEl.appendChild(h('img',{src:dataUrl,class:'scan-preview-img'}));
  previewEl.style.display='block';
}

function startScanOCR(base64,mime,statusEl,resultsEl){
  statusEl.innerHTML='';
  statusEl.appendChild(h('div',{class:'scan-status loading'},h('div',{class:'spinner'}),'מנתח את המסמך עם AI...'));
  resultsEl.innerHTML='';
  callClaudeOCR(base64,mime,statusEl,resultsEl);
}

async function callClaudeOCR(base64,mime,statusEl,resultsEl){
  var apiKey=getApiKey();
  var prompt='אתה מנתח חשבוניות וקבלות עבור מערכת ניהול בית.\nנתח את המסמך שצורף והחזר JSON בלבד (ללא backticks, ללא הסברים) בפורמט הבא:\n{\n  "docType": "receipt|invoice|warranty|utility_bill|other",\n  "storeName": "שם החנות/ספק",\n  "date": "YYYY-MM-DD או null",\n  "totalAmount": מספר או null,\n  "currency": "ILS|USD|EUR",\n  "description": "תיאור קצר של המסמך",\n  "utilityType": "electricity|water|gas|internet|phone|arnona|vaad|insurance|other|null",\n  "items": [\n    {\n      "name": "שם המוצר",\n      "model": "דגם או null",\n      "price": מספר או null,\n      "warrantyYears": מספר או null\n    }\n  ]\n}\nהחזר ONLY valid JSON.';
  try{
    // Build content block based on file type
    var contentBlock;
    if(mime==='application/pdf'){
      contentBlock={type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}};
    } else {
      contentBlock={type:'image',source:{type:'base64',media_type:mime,data:base64}};
    }
    var body={
      model:'claude-opus-4-5',
      max_tokens:1024,
      messages:[{role:'user',content:[contentBlock,{type:'text',text:prompt}]}]
    };
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify(body)
    });
    if(!res.ok){var err=await res.json();throw new Error(err.error&&err.error.message||'שגיאת API: '+res.status);}
    var data=await res.json();
    var text=data.content.map(function(c){return c.text||'';}).join('');
    var clean=text.replace(/```json|```/g,'').trim();
    var parsed=JSON.parse(clean);
    statusEl.innerHTML='';
    statusEl.appendChild(h('div',{class:'scan-status success'},'✓ המסמך נסרק בהצלחה!'));
    renderScanResults(parsed,resultsEl,base64,mime);
  }catch(err){
    statusEl.innerHTML='';
    statusEl.appendChild(h('div',{class:'scan-status error'},'⚠ '+err.message));
  }
}

  // Action buttons

  // Create bill button
  var utilSel=h('select',{style:{display:'none'}});
  BTYPES.forEach(function(t){var o=h('option',{value:t.id},t.l);if(t.id===(data.utilityType||'other'))o.selected=true;utilSel.appendChild(o);});
  btns.appendChild(h('button',{class:'btn-create-bill',onClick:function(){
    var bill={id:uid(),createdAt:new Date().toISOString(),type:data.utilityType||'other',description:storeInp.value.trim()||descInp.value.trim(),amount:parseFloat(amtInp.value)||0,dueDate:dateInp.value,period:'',isPaid:true,notes:'סרוק אוטומטית'};

    saveDB();closeScan();UI.view='bills';render();
    showToast('חשבון נוצר בהצלחה!');
  }},'+ צור חשבון שירות'));

  // Create product button
  if(data.items&&data.items.length){
    btns.appendChild(h('button',{class:'btn-create-prod',onClick:function(){

var HEB_MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function getMonthKey(dateStr){if(!dateStr)return null;return dateStr.slice(0,7);}
function monthLabel(key){if(!key)return'';var p=key.split('-');return HEB_MONTHS[parseInt(p[1],10)-1]+' '+p[0];}
function buildMonthlyData(year){
  var months={};
  DB.bills.forEach(function(b){
    var key=getMonthKey(b.dueDate);
    if(!key)return;
    if(year&&key.slice(0,4)!==String(year))return;
    if(!months[key])months[key]={key:key,paid:0,unpaid:0,bills:[]};
    if(b.isPaid)months[key].paid+=b.amount;
    else months[key].unpaid+=b.amount;
    months[key].bills.push(b);
  });
  return Object.values(months).sort(function(a,b){return a.key.localeCompare(b.key);});
}
function getAvailableYears(){
  var yrs={};DB.bills.forEach(function(b){if(b.dueDate)yrs[b.dueDate.slice(0,4)]=1;});
  return Object.keys(yrs).sort().reverse();
}

  });
  return Object.values(groups).map(function(g){
    g.bills.sort(function(a,b){return a.dueDate.localeCompare(b.dueDate);});
    g.paidCount=g.bills.filter(function(b){return b.isPaid;}).length;
    g.totalCount=g.bills.length;
    g.totalAmount=g.bills.reduce(function(s,b){return s+b.amount;},0);
    g.paidAmount=g.bills.filter(function(b){return b.isPaid;}).reduce(function(s,b){return s+b.amount;},0);
    g.nextUnpaid=g.bills.find(function(b){return !b.isPaid;})||null;
    return g;
  });
}

function createInstallmentBills(data,startDate,numInst,cardLast4,amtPerInst){
  var groupId=uid();
  for(var i=0;i<numInst;i++){
    var d=new Date(startDate);d.setMonth(d.getMonth()+i);
    var dateStr=d.toISOString().slice(0,10);
    DB.bills.push(Object.assign({},data,{
      id:uid(),createdAt:new Date().toISOString(),
      dueDate:dateStr,
      amount:amtPerInst,
      isPaid:false,
      autoDebit:true,
      period:HEB_MONTHS[d.getMonth()]+' '+d.getFullYear(),
      installmentGroupId:groupId,
      installmentTotal:numInst,
      installmentCurrent:i+1,
      cardLast4:cardLast4,
      description:(data.description||'')+(data.description?' ':'')+'תשלום '+(i+1)+'/'+numInst
    }));
  }
}

function applyAutoDebits(){
  var today=todayS();var changed=false;
  DB.bills=DB.bills.map(function(b){
    if(b.autoDebit&&!b.isPaid&&b.dueDate&&b.dueDate<=today){changed=true;return Object.assign({},b,{isPaid:true});}
    return b;
  });
  if(changed)saveDB();
}

/* ====================== BILL FORM ====================== */
function buildBillForm(){
  var isEdit=UI.view==='edit_bill',b=isEdit?UI.editing:{};var wrap=h('div',{});
  wrap.appendChild(h('div',{class:'section-hdr'},h('div',{class:'sec-title'},isEdit?'עריכת חשבון':'הוספת חשבון')));
  var form=h('div',{class:'form-wrap'});
  function field(lbl,inp,hint){var f=h('div',{class:'field'},h('label',{},lbl),inp);if(hint)f.appendChild(h('div',{class:'hint'},hint));return f;}
  var tp=h('select',{});BTYPES.forEach(function(t){var o=h('option',{value:t.id},t.l);if(b.type===t.id)o.selected=true;tp.appendChild(o);});
  var ds=h('input',{type:'text',value:b.description||'',placeholder:'תיאור / ספק'});
  var am=h('input',{type:'number',value:b.amount||'',placeholder:'0'});
  var dd=h('input',{type:'date',value:b.dueDate||todayS()});
  var pe=h('input',{type:'text',value:b.period||'',placeholder:'ינואר 2025'});
  var pc=h('input',{type:'checkbox',checked:b.isPaid||false});
  var nt=h('textarea',{placeholder:'הערות...'},b.notes||'');

  // Installment fields
  var isInstall=!isEdit&&false;
  var toggleSw=h('div',{class:'toggle-sw'+(isInstall?' on':'')});
  var instBox=h('div',{class:'inst-form-box',style:{display:'none'}});
  var numInstInp=h('input',{type:'number',value:'6',min:'2',max:'60',step:'1',placeholder:'מספר תשלומים'});
  var cardInp=h('input',{type:'text',value:'',maxlength:'4',placeholder:'4 ספרות אחרונות',style:{letterSpacing:'3px',maxWidth:'130px'}});
  var amtPerEl=h('div',{style:{fontSize:'12px',color:'var(--txt2)',marginTop:'4px'}});

  function updateAmtPer(){
    var total=parseFloat(am.value)||0;var n=parseInt(numInstInp.value)||1;
    if(total>0&&n>0)amtPerEl.textContent='₪'+Math.round(total/n).toLocaleString()+' לתשלום × '+n+' תשלומים';
    else amtPerEl.textContent='';
  }
  am.addEventListener('input',updateAmtPer);numInstInp.addEventListener('input',updateAmtPer);

  instBox.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}},
    h('div',{class:'field'},h('label',{},'מספר תשלומים'),numInstInp),
    h('div',{class:'field'},h('label',{},'4 ספרות אחרונות כרטיס'),cardInp)
  ));
  instBox.appendChild(amtPerEl);

  var toggleRow=h('div',{class:'inst-toggle',onClick:function(){
    isInstall=!isInstall;
    if(isInstall){toggleSw.classList.add('on');instBox.style.display='block';}
    else{toggleSw.classList.remove('on');instBox.style.display='none';}
  }},toggleSw,h('div',{class:'inst-toggle-lbl'},'פריסה בתשלומים'));

  form.appendChild(field('סוג חשבון',tp));
  form.appendChild(field('ספק / תיאור',ds));
  form.appendChild(h('div',{class:'form-row'},
    field(isInstall?'סכום כולל (₪)':'סכום (₪)',am),
    field('תאריך תשלום ראשון',dd)
  ));
  if(!isEdit)form.appendChild(toggleRow);
  if(!isEdit)form.appendChild(instBox);
  form.appendChild(field('תקופה',pe));
  form.appendChild(field('הערות',nt));
  if(!isEdit||!b.installmentGroupId)form.appendChild(h('div',{class:'field',style:{display:'flex',alignItems:'center',gap:'8px'}},pc,h('label',{style:{margin:'0',cursor:'pointer'},onClick:function(){pc.checked=!pc.checked;}},'שולם')));

  var errEl=h('div',{class:'err'});form.appendChild(errEl);
  form.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'16px'}},
    h('button',{class:'btn-primary',onClick:function(){
      if(!am.value){errEl.textContent='נא להזין סכום';return;}
      var data={type:tp.value,description:ds.value.trim(),notes:nt.value.trim(),period:pe.value.trim()};
      if(isInstall&&!isEdit){
        var n=parseInt(numInstInp.value)||1;
        if(n<2||n>60){errEl.textContent='נא להזין מספר תשלומים בין 2 ל-60';return;}
        var card=cardInp.value.trim();
        if(card&&card.length!==4){errEl.textContent='נא להזין בדיוק 4 ספרות';return;}
        var total=parseFloat(am.value)||0;
        var perInst=Math.round(total/n);
        createInstallmentBills(data,dd.value,n,card,perInst);
      } else {
        var billData=Object.assign({},data,{amount:parseFloat(am.value)||0,dueDate:dd.value,isPaid:pc.checked});
        if(isEdit)DB.bills=DB.bills.map(function(x){return x.id===b.id?Object.assign({},x,billData):x;});
        else DB.bills.push(Object.assign({},billData,{id:uid(),createdAt:new Date().toISOString()}));
      }
      saveDB();UI.view='bills';UI.editing=null;render();
    }},isEdit?'שמור שינויים':isInstall?'צור תוכנית תשלומים':'הוסף חשבון'),
    h('button',{class:'btn-cancel',onClick:function(){UI.view='bills';UI.editing=null;renderBody();}},'ביטול')
  ));
  wrap.appendChild(form);return wrap;
}
function delProduct(id){DB.products=DB.products.filter(function(p){return p.id!==id;});saveDB();render();}
function delBill(id){
  var bill=DB.bills.find(function(b){return b.id===id;});
  if(bill&&bill.installmentGroupId){
    var groupId=bill.installmentGroupId;
    var groupBills=DB.bills.filter(function(b){return b.installmentGroupId===groupId;});
    var paid=groupBills.filter(function(b){return b.isPaid;}).length;
    var total=groupBills.length;
    var msg='מחיקת עסקת התשלומים כולה:\n'+btL(bill.type)+(bill.cardLast4?' (****'+bill.cardLast4+')':'')+'\n'+total+' תשלומים ('+paid+' שולמו)\n\nהאם למחוק את כל העסקה?';
    if(confirm(msg)){
      DB.bills=DB.bills.filter(function(b){return b.installmentGroupId!==groupId;});
      saveDB();render();
    }
  } else {
    if(confirm('למחוק חשבון זה?')){DB.bills=DB.bills.filter(function(b){return b.id!==id;});saveDB();render();}
  }
}
function togglePaid(id){DB.bills=DB.bills.map(function(b){return b.id===id?Object.assign({},b,{isPaid:!b.isPaid}):b;});saveDB();renderBody();}
loadDB();applyAutoDebits();render();
</script>
